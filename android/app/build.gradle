plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
if (!keystorePropertiesFile.exists()) {
    throw new GradleException("Missing android/key.properties for release signing")
}

def keystoreProperties = new Properties()
keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties[it]?.trim()
}
if (!missingSigningProperties.isEmpty()) {
    throw new GradleException("Missing release signing properties: ${missingSigningProperties.join(', ')}")
}

def releaseKeystoreFile = rootProject.file(keystoreProperties["storeFile"])
if (!releaseKeystoreFile.exists()) {
    throw new GradleException("Release keystore does not exist: ${releaseKeystoreFile}")
}

android {
    namespace = "com.zyronon.v2next"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.zyronon.v2next"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile = releaseKeystoreFile
            storePassword = keystoreProperties["storePassword"]
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
        }
    }

    buildTypes {
        release {
//            signingConfig signingConfigs.debug
            signingConfig = signingConfigs.release
            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
