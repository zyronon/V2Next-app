org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Keep the legacy Android DSL until Flutter plugins support AGP 9's new DSL.
android.newDsl=false
# Keep using the Kotlin Gradle plugin until Flutter plugins support AGP 9's built-in Kotlin.
android.builtInKotlin=false
# Pub plugins are cached on C: while this project is on E:. Kotlin's incremental
# cache cannot relativize sources across Windows drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
